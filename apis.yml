aid: elektrik-app
name: Elektrik App
description: >-
  Elektrik is a medium voltage (MV) equipment procurement platform for
  electrical distributors, contractors, and Engineering, Procurement &
  Construction (EPC) firms. Founded in 2020 by Mario Dealba out of the Techstars
  Alabama EnergyTech Accelerator, the company streamlines sourcing of medium- to
  high-voltage supplies (roughly 5kV-35kV / 600V-69kV) including MV cable,
  terminations, splices, deadbreak and loadbreak connectors, and transformers.
  Buyers build part lists and specifications in the web app and Elektrik surfaces
  matching products across leading manufacturers such as TE Connectivity, BURNDY,
  Richards Manufacturing, and PFISTERER, compressing a traditionally slow,
  quote-driven procurement cycle. Backed by Techstars and growth capital, Elektrik
  is added to the API Evangelist network for enrichment; the company does not
  currently publish a public API, developer portal, or OpenAPI.
